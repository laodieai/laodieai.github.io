<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>老爹面馆 · 打包</title><meta name="theme-color" content="#a81c18">
<style>html{-webkit-text-size-adjust:100%!important;text-size-adjust:100%!important}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#fbf4ec;color:#2a1410;text-align:center}
.xh{background:#b3201b repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 10px,transparent 10px 20px);color:#fff;padding:30px 20px 34px;padding-top:calc(30px + env(safe-area-inset-top))}
.seal{width:66px;height:66px;border-radius:18px;background:#f3b63f;color:#b3201b;display:flex;align-items:center;justify-content:center;font-size:38px;line-height:1;font-weight:900;margin:0 auto 12px;font-family:"Songti SC","STSong",serif}
.xh b{display:block;font-size:32px;letter-spacing:5px;line-height:1.15;font-family:"Songti SC","STSong",serif;white-space:nowrap}
.xh small{display:block;margin-top:6px;opacity:.88;font-size:15px}
#msg{padding:40px 20px;font-size:17px;line-height:1.7;color:#8a7266}
.big{font-size:20px;font-weight:900;color:#b3201b}.btn{display:inline-block;margin-top:18px;padding:12px 28px;border-radius:24px;background:#b3201b;color:#fff;border:0;font-size:17px;text-decoration:none;-webkit-appearance:none}
.spin{width:34px;height:34px;border:4px solid #b3201b;border-color:#b3201b transparent #b3201b transparent;border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head>
<body><div class="xh"><b>老爹面馆</b><small>打包带走</small></div><div id="msg"><div class="spin"></div>正在打开，请稍等…</div>
<script src="go.js?v=1"></script><script>goLive('/takeaway','<div class=big>系统暂时连不上</div><div>请稍后再试，或直接打电话给店里 🙏</div><button class=btn onclick=location.reload()>再试一次</button>');</script></body></html>
