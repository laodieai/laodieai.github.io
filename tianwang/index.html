<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>香港四大天王</title>
<style>
  :root {
    --ink: #1c1917;
    --muted: #57534e;
    --line: #e7e5e4;
    --soft: #fafaf9;
    --accent: #9f1239;
    --play: #fff1f2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: var(--ink); }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    padding-bottom: calc(128px + env(safe-area-inset-bottom));
  }
  header, main { width: min(880px, 100%); margin: 0 auto; }
  header { padding: 28px 16px 8px; }
  h1 { margin: 0; font-size: 28px; font-weight: 650; letter-spacing: 0.02em; }
  .sub { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 16px 0 4px; }
  .chips::-webkit-scrollbar { height: 0; }
  .chip, button, .full {
    font: inherit;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    min-height: 40px;
    padding: 0 14px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .chip { white-space: nowrap; }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .covers-head { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 0; }
  .covers-head span { color: var(--muted); font-size: 13px; }
  #allalbums { min-height: 36px; }
  .who { margin: 14px 0 0; font-size: 16px; font-weight: 650; }
  .covers {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px 10px;
    padding: 8px 0 4px;
  }
  .covers button.cover {
    border: 0;
    border-radius: 0;
    background: transparent;
    min-height: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    text-align: left;
    color: var(--ink);
  }
  .covers button.cover img,
  .covers button.cover .ph {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 10px;
    background: #f4f4f5;
    display: block;
  }
  .covers button.cover .ph {
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 18px;
    font-weight: 650;
  }
  .covers button.cover.on img,
  .covers button.cover.on .ph { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--accent); }
  .covers button.cover b {
    margin-top: 6px;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .covers button.cover small { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .tools { display: flex; gap: 8px; padding: 12px 0 8px; }
  #q {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    background: #fff;
    color: var(--ink);
  }
  .plays { display: flex; gap: 8px; padding: 0 0 8px; }
  .plays button { flex: 1; white-space: nowrap; }
  .plays button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .count { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  .year {
    position: sticky;
    top: 0;
    background: #fff;
    color: var(--accent);
    font-size: 13px;
    font-weight: 650;
    padding: 10px 16px 4px;
    border-bottom: 1px solid var(--line);
  }
  .row {
    width: 100%;
    display: grid;
    grid-template-columns: 52px 1fr auto;
    gap: 8px;
    align-items: center;
    text-align: left;
    border: 0;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    background: #fff;
    min-height: 58px;
    padding: 8px 16px;
  }
  .row.on { background: var(--play); }
  .row small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .row b { font-weight: 600; }
  .mark { color: var(--accent); font-size: 12px; }
  .player {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: #fff;
    border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  .player-inner { width: min(880px, 100%); margin: 0 auto; }
  #now-title { font-weight: 650; }
  #now-meta { color: var(--muted); font-size: 13px; margin-top: 2px; min-height: 1.2em; }
  #bar { width: 100%; margin: 8px 0; accent-color: var(--accent); }
  .controls { display: flex; gap: 8px; }
  .controls button, .controls .full { flex: 1; }
  #toggle { background: var(--accent); color: #fff; border-color: var(--accent); }
  .empty { padding: 32px 16px; color: var(--muted); }
  @media (max-width: 640px) {
    .tools, .plays { flex-direction: column; }
  }
  @media (min-width: 720px) {
    .covers { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  }
  @media (min-width: 800px) {
    h1 { font-size: 36px; }
    header { padding-top: 40px; }
    .chips { flex-wrap: wrap; overflow: visible; }
  }
</style>
</head>
<body>
<header>
  <h1>香港四大天王</h1>
  <p class="sub">张学友、刘德华、郭富城、黎明，加上张国荣、谭咏麟。专辑封面从出道排到现在，点一张封面就开始播。页内是试听，全曲打开 Apple Music。</p>
  <div class="chips" id="chips"></div>
  <div class="covers-head">
    <span>专辑封面，从早到现在</span>
    <button id="allalbums" type="button">全部歌曲</button>
  </div>
  <div id="covers"></div>
  <div class="tools">
    <input id="q" type="search" placeholder="搜歌名或专辑" enterkeyhint="search">
  </div>
  <div class="plays">
    <button id="playold" type="button" class="on">从最早播到现在</button>
    <button id="playnew" type="button">从现在到过去</button>
  </div>
  <p class="count" id="count"></p>
</header>
<main id="list"></main>
<div class="player">
  <div class="player-inner">
    <div id="now-title">还没播放</div>
    <div id="now-meta">选一个人，或从最早一首开始</div>
    <input id="bar" type="range" min="0" max="1000" value="0" aria-label="播放进度">
    <div class="controls">
      <button id="prev" type="button">上一首</button>
      <button id="toggle" type="button">播放</button>
      <button id="next" type="button">下一首</button>
      <a class="full" id="full" href="#" target="_blank" rel="noopener">全曲</a>
    </div>
  </div>
</div>
<audio id="audio" preload="none" playsinline></audio>
<script>
const ARTISTS = ["张学友", "刘德华", "郭富城", "黎明", "张国荣", "谭咏麟"];
let songs = [];
let view = [];
let artist = "张学友";
let albumIndex = "";
let albumList = [];
let order = "old";
let cursor = -1;
let seeking = false;
let usingDirect = false;

const audio = document.getElementById("audio");
const listEl = document.getElementById("list");
const qEl = document.getElementById("q");

function span(name) {
  const mine = songs.filter(s => s.artist === name);
  if (!mine.length) return "";
  return mine[0].year + "–" + mine[mine.length - 1].year;
}

function renderChips() {
  const box = document.getElementById("chips");
  const names = ["全部", ...ARTISTS];
  box.innerHTML = names.map(name => {
    const n = name === "全部" ? songs.length : songs.filter(s => s.artist === name).length;
    const extra = name === "全部" ? "" : " " + span(name);
    return `<button type="button" class="chip${name === artist ? " on" : ""}" data-artist="${name}">${name} ${n}${extra}</button>`;
  }).join("");
}

function renderCovers() {
  const box = document.getElementById("covers");
  albumList = [];
  const names = artist === "全部" ? ARTISTS : [artist];
  const parts = [];
  names.forEach(name => {
    const seen = new Map();
    songs.forEach(s => {
      if (s.artist !== name) return;
      if (!seen.has(s.album)) seen.set(s.album, { year: s.year, count: 0, art: s.art || "" });
      const info = seen.get(s.album);
      info.count += 1;
      if (!info.art && s.art) info.art = s.art;
    });
    if (artist === "全部") parts.push(`<h2 class="who">${name}</h2>`);
    parts.push(`<div class="covers">`);
    seen.forEach((info, title) => {
      const idx = String(albumList.length);
      albumList.push({ artist: name, album: title });
      const on = idx === albumIndex ? " on" : "";
      const face = info.art
        ? `<img src="${escapeHtml(info.art)}" alt="" loading="lazy">`
        : `<span class="ph">${escapeHtml(info.year)}</span>`;
      parts.push(`<button type="button" class="cover${on}" data-album="${idx}">${face}<b>${escapeHtml(title)}</b><small>${info.year} · ${info.count}首</small></button>`);
    });
    parts.push(`</div>`);
  });
  box.innerHTML = parts.join("");
}

function markOrder() {
  document.getElementById("playold").classList.toggle("on", order === "old");
  document.getElementById("playnew").classList.toggle("on", order === "new");
}

function apply() {
  const q = qEl.value.trim().toLowerCase();
  const picked = albumIndex === "" ? null : albumList[Number(albumIndex)];
  const chrono = songs.filter(s => {
    if (artist !== "全部" && s.artist !== artist) return false;
    if (picked && (s.artist !== picked.artist || s.album !== picked.album)) return false;
    if (!q) return true;
    return (s.title + s.album + s.artist).toLowerCase().includes(q);
  });
  view = order === "new" ? chrono.slice().reverse() : chrono;
  const label = picked ? picked.album : (artist === "全部" ? "全部" : artist);
  const years = chrono.length ? `${chrono[0].year}–${chrono[chrono.length - 1].year}` : "";
  document.getElementById("count").textContent = view.length ? `${label} ${view.length} 首 · ${years}` : "没有匹配的歌";
  const parts = [];
  let year = "";
  view.forEach((s, i) => {
    if (s.year !== year) {
      year = s.year;
      parts.push(`<div class="year">${year}</div>`);
    }
    const on = i === cursor ? " on" : "";
    parts.push(`<button type="button" class="row${on}" data-i="${i}"><span class="mark">${String(i + 1)}</span><span><b>${escapeHtml(s.title)}</b><small>${escapeHtml(s.artist)} · ${escapeHtml(s.album)}</small></span><span class="mark">播</span></button>`);
  });
  listEl.innerHTML = parts.join("") || `<p class="empty">没有这首。换个字，或清掉搜索。</p>`;
  const current = listEl.querySelector(".row.on");
  if (current) current.scrollIntoView({ block: "nearest" });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function playAt(i) {
  if (!view.length) return;
  if (i < 0) i = 0;
  if (i >= view.length) {
    cursor = view.length - 1;
    audio.pause();
    document.getElementById("toggle").textContent = "播放";
    document.getElementById("now-meta").textContent = order === "new" ? "已经放到最早这一首" : "已经放到现在这一首";
    return;
  }
  cursor = i;
  const s = view[i];
  const onLocal = location.hostname === "127.0.0.1" || location.hostname === "localhost";
  usingDirect = !onLocal;
  audio.src = onLocal ? `api/audio?id=${s.id}` : s.preview;
  const played = audio.play();
  if (played) played.catch(() => {});
  document.getElementById("toggle").textContent = "暂停";
  document.getElementById("now-title").textContent = s.title;
  document.getElementById("now-meta").textContent = `${s.artist} · ${s.year} · 第 ${i + 1} / ${view.length} 首`;
  const full = document.getElementById("full");
  full.href = s.full || "#";
  apply();
}

document.getElementById("chips").addEventListener("click", e => {
  const btn = e.target.closest("[data-artist]");
  if (!btn) return;
  artist = btn.dataset.artist;
  albumIndex = "";
  cursor = -1;
  renderChips();
  renderCovers();
  apply();
});
document.getElementById("covers").addEventListener("click", e => {
  const btn = e.target.closest("[data-album]");
  if (!btn) return;
  albumIndex = btn.dataset.album;
  cursor = -1;
  renderCovers();
  apply();
  const picked = document.querySelector(".cover.on");
  if (picked) picked.scrollIntoView({ block: "nearest" });
  playAt(0);
});
document.getElementById("allalbums").addEventListener("click", () => {
  albumIndex = "";
  cursor = -1;
  renderCovers();
  apply();
});
qEl.addEventListener("input", () => { cursor = -1; apply(); });
function startOrder(next) {
  order = next;
  markOrder();
  cursor = -1;
  apply();
  playAt(0);
}
document.getElementById("playold").addEventListener("click", () => startOrder("old"));
document.getElementById("playnew").addEventListener("click", () => startOrder("new"));
listEl.addEventListener("click", e => {
  const row = e.target.closest("[data-i]");
  if (!row) return;
  playAt(Number(row.dataset.i));
});
document.getElementById("prev").addEventListener("click", () => playAt(Math.max(0, cursor - 1)));
document.getElementById("next").addEventListener("click", () => playAt(cursor + 1));
document.getElementById("toggle").addEventListener("click", () => {
  if (cursor < 0) { playAt(0); return; }
  if (audio.paused) {
    audio.play();
    document.getElementById("toggle").textContent = "暂停";
  } else {
    audio.pause();
    document.getElementById("toggle").textContent = "播放";
  }
});
document.getElementById("full").addEventListener("click", e => {
  const s = view[cursor];
  if (!s || !s.full) e.preventDefault();
});

audio.addEventListener("ended", () => playAt(cursor + 1));
audio.addEventListener("error", () => {
  const s = view[cursor];
  if (!usingDirect && s && s.preview) {
    usingDirect = true;
    audio.src = s.preview;
    audio.play().catch(() => {});
    return;
  }
  playAt(cursor + 1);
});
audio.addEventListener("timeupdate", () => {
  if (seeking || !audio.duration) return;
  document.getElementById("bar").value = Math.round(audio.currentTime / audio.duration * 1000);
});
const bar = document.getElementById("bar");
bar.addEventListener("pointerdown", () => { seeking = true; });
bar.addEventListener("input", () => {
  if (!audio.duration) return;
  audio.currentTime = bar.value / 1000 * audio.duration;
});
bar.addEventListener("change", () => { seeking = false; });

fetch("songs.json")
  .then(r => r.json())
  .then(data => {
    songs = data;
    renderChips();
    renderCovers();
    apply();
  })
  .catch(() => {
    document.getElementById("count").textContent = "曲目没加载出来。请用文件夹里的「打开.command」启动。";
  });
</script>
</body>
</html>
