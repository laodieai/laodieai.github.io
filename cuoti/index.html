<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>错题闭环本 · 八下</title>
<meta name="theme-color" content="#1971c2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <!-- 今日 -->
  <section class="view active" id="view-today">
    <header class="page-head">
      <h1>今日复习</h1>
      <p class="sub" id="todayDate"></p>
    </header>
    <div class="due-hero" id="dueHero">
      <div class="due-num" id="dueNum">0</div>
      <div class="due-text">道错题到了复测时间<br><small>遮住答案重做 · 三次独立做对才过关</small></div>
    </div>
    <div id="dueList" class="cards"></div>

    <h2 class="sec-title">📊 最近情况</h2>
    <div class="stat-row">
      <div class="stat-box"><b id="stTotal">0</b><span>全部错题</span></div>
      <div class="stat-box warn"><b id="stLearning">0</b><span>未过关</span></div>
      <div class="stat-box ok"><b id="stPassed">0</b><span>已过关</span></div>
      <div class="stat-box"><b id="stWeek">0</b><span>本周新增</span></div>
    </div>
    <h2 class="sec-title">🔥 薄弱知识点 Top 5</h2>
    <div id="weakList" class="weak-list"></div>
  </section>

  <!-- 错题本 -->
  <section class="view" id="view-list">
    <header class="page-head"><h1>错题本</h1></header>
    <div class="filters">
      <select id="fSubject"><option value="">全部科目</option></select>
      <select id="fStatus">
        <option value="learning">未过关</option>
        <option value="due">今日到期</option>
        <option value="passed">已过关</option>
        <option value="all">全部</option>
      </select>
    </div>
    <div id="mistakeList" class="cards"></div>
  </section>

  <!-- 录入 -->
  <section class="view" id="view-add">
    <header class="page-head"><h1>录入错题</h1><p class="sub">拍一张卷子照片就行，30 秒搞定</p></header>
    <form id="addForm">
      <label class="burst-row"><input type="checkbox" id="burstMode"> <span>连续录入：录完一道接着拍下一张（科目、章节、错因沿用）</span></label>
      <label class="field-label">科目</label>
      <div class="subject-pick" id="subjectPick"></div>

      <label class="field-label">章节</label>
      <select id="chapterSel" required></select>

      <label class="field-label">知识点（可自己输入）</label>
      <input id="topicInput" list="topicList" placeholder="选一个或直接打字" autocomplete="off">
      <datalist id="topicList"></datalist>

      <label class="field-label">丢分原因</label>
      <div class="reason-pick" id="reasonPick"></div>

      <label class="field-label">题目照片</label>
      <label class="shot">
        <input type="file" id="imgInput" accept="image/*" hidden>
        <span id="shotHint">📷 拍照 / 点此选图</span>
        <img id="shotPreview" hidden alt="错题照片">
      </label>

      <label class="field-label">备注（正确思路 / 答案，可选）</label>
      <textarea id="noteInput" rows="2" placeholder="例：配方时常数项要加一次减一次"></textarea>

      <button type="submit" class="btn-primary">保存错题</button>
    </form>
  </section>

  <!-- 统计 -->
  <section class="view" id="view-stats">
    <header class="page-head"><h1>薄弱点分析</h1><p class="sub">同一知识点错 2 次以上，优先补</p></header>
    <div id="subjectBars" class="bars"></div>
    <h2 class="sec-title">知识点错次排行</h2>
    <div id="topicRank" class="weak-list"></div>
  </section>

  <!-- 设置 -->
  <section class="view" id="view-more">
    <header class="page-head"><h1>备份与设置</h1></header>
    <div class="more-card">
      <h3>数据备份</h3>
      <p class="hint">照片存在本机浏览器里。换手机或清理缓存前，先导出备份文件。</p>
      <button class="btn-line" id="exportBtn">⬇️ 导出全部数据</button>
      <label class="btn-line file-btn">⬆️ 导入备份文件<input type="file" id="importInput" accept="application/json" hidden></label>
    </div>
    <div class="more-card">
      <h3>复习节奏</h3>
      <p class="hint">录入当天订正 → 3 天后复测 → 2 周后再复测，两次都独立做对即过关；中途做错重新计时。</p>
      <label class="switch-row">复测通过间隔（天）
        <span>第1次 <input type="number" id="gap1" min="1" max="30" style="width:52px">
        · 第2次 <input type="number" id="gap2" min="1" max="60" style="width:52px"></span>
      </label>
    </div>
    <div class="more-card danger">
      <h3>清空数据</h3>
      <button class="btn-danger" id="wipeBtn">清空全部错题和照片</button>
    </div>
    <p class="foot-note">错题闭环本 · 八下（语数英科）· 数据只在本机</p>
  </section>

  <nav class="tabbar">
    <button class="tab active" data-view="today"><span>📅</span>今日</button>
    <button class="tab" data-view="list"><span>📚</span>错题本</button>
    <button class="tab add" data-view="add"><span>＋</span>录入</button>
    <button class="tab" data-view="stats"><span>📊</span>分析</button>
    <button class="tab" data-view="more"><span>⚙️</span>备份</button>
  </nav>
</div>

<!-- 错题详情弹层 -->
<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <button class="modal-x" id="modalX">×</button>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
