<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>365天学美式英语 · 每天50词</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #ffffff; color: #1f2328;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 12px 14px 60px; }

  /* 顶部 */
  header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 2px solid #e5e7eb; }
  h1 { font-size: 22px; margin-right: auto; }
  h1 small { font-size: 13px; color: #6b7280; font-weight: normal; margin-left: 6px; }
  .dayNav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .navBtn {
    font-size: 18px; padding: 8px 14px; border: 1px solid #d1d5db; background: #fff;
    border-radius: 8px; cursor: pointer;
  }
  .navBtn:active { background: #f3f4f6; }
  #dayInput {
    width: 78px; font-size: 18px; text-align: center; padding: 8px 4px;
    border: 2px solid #2563eb; border-radius: 8px;
  }
  #dayInput.doneToday { border-color: #16a34a; background: #f0fdf4; }
  #dateLabel { font-size: 15px; color: #374151; width: 100%; }
  #doneCount { font-size: 13px; color: #16a34a; }

  /* 大字显示区 */
  .stage { text-align: center; padding: 26px 10px 18px; border-bottom: 1px solid #e5e7eb; }
  #bigSec { font-size: 14px; color: #6b7280; margin-bottom: 10px; line-height: 1.5; }
  #bigWord { font-size: 52px; font-weight: 700; color: #111827; line-height: 1.2; word-break: break-word; }
  #bigZh { font-size: 30px; color: #2563eb; margin-top: 10px; }
  #counter { font-size: 14px; color: #6b7280; margin-top: 14px; }
  .barWrap { height: 8px; background: #e5e7eb; border-radius: 4px; margin-top: 8px; overflow: hidden; }
  #bar { height: 100%; width: 0; background: #2563eb; border-radius: 4px; transition: width .3s; }

  /* 播放控制 */
  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 16px 0; border-bottom: 1px solid #e5e7eb; }
  .ctlBtn {
    font-size: 19px; padding: 14px 22px; border: 1px solid #d1d5db; background: #fff;
    border-radius: 10px; cursor: pointer; min-width: 88px;
  }
  .ctlBtn:active { background: #f3f4f6; }
  #playBtn { background: #2563eb; color: #fff; border-color: #2563eb; font-weight: 700; min-width: 120px; }
  #playBtn.playing { background: #dc2626; border-color: #dc2626; }
  #doneBtn { background: #16a34a; color: #fff; border-color: #16a34a; }

  .settings { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center;
    padding: 12px 0; border-bottom: 1px solid #e5e7eb; font-size: 15px; color: #374151; }
  .settings label { display: flex; align-items: center; gap: 5px; }
  .settings select { font-size: 15px; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; max-width: 200px; }
  .settings input[type=checkbox] { width: 20px; height: 20px; }

  /* 五个区 */
  #sections { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 0; }
  .chip {
    font-size: 16px; padding: 10px 16px; border-radius: 20px; border: 1px solid #93c5fd;
    background: #eff6ff; color: #1d4ed8; cursor: pointer;
  }
  .chip.phonic { border-color: #fdba74; background: #fff7ed; color: #c2410c; }
  .chip:active { transform: scale(.97); }

  /* 单词列表 */
  .band { border-top: 2px solid #e5e7eb; padding: 12px 0; }
  .bandHead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .bandName { font-size: 18px; font-weight: 700; }
  .bandName small { color: #6b7280; font-weight: normal; font-size: 13px; margin-left: 4px; }
  .miniBtn { font-size: 14px; padding: 6px 12px; border: 1px solid #2563eb; color: #2563eb; background: #fff; border-radius: 6px; cursor: pointer; }
  .bandTip { font-size: 13px; color: #c2410c; background: #fff7ed; border-radius: 6px; padding: 6px 10px; margin-bottom: 8px; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } #bigWord { font-size: 40px; } #bigZh { font-size: 24px; } }
  .wrow {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    font-size: 17px; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px;
    background: #fff; cursor: pointer; text-align: left;
  }
  .wrow b { color: #111827; font-weight: 600; }
  .wrow span { color: #6b7280; font-size: 15px; }
  .wrow.cur { border: 2px solid #2563eb; background: #dbeafe; box-shadow: 0 0 0 2px #bfdbfe; }
  .wrow.cur b { color: #1d4ed8; font-weight: 700; }
  .wrow.cur b::before { content: "▸ "; color: #2563eb; }

  .calWrap { margin-top: 14px; }
  #streak { margin-left: 10px; font-size: 14px; color: #16a34a; font-weight: 600; }
  #calendar { margin-top: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .mon { border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px; background: #fff; }
  .monName { font-size: 13px; font-weight: 700; color: #374151; text-align: center; margin-bottom: 6px; }
  .monGrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .dcell {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: #374151; border-radius: 6px; cursor: pointer; background: #f9fafb;
  }
  .dcell.empty { background: transparent; cursor: default; }
  .dcell.done { background: #bbf7d0; color: #15803d; font-weight: 700; }
  .dcell.today { box-shadow: inset 0 0 0 2px #f97316; }
  .dcell.sel { background: #2563eb; color: #fff; font-weight: 700; }
  .dcell.done.sel { background: #16a34a; color: #fff; }

  .foot { text-align: center; color: #9ca3af; font-size: 13px; padding-top: 24px; line-height: 1.8; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>365天学美式英语<small>每天50词 · 英中双语朗读 · 循环跟读</small></h1>
    <div class="dayNav">
      <button class="navBtn" id="prevDay">前一天</button>
      <input id="dayInput" type="number" min="1" max="365">
      <button class="navBtn" id="nextDay">后一天</button>
      <button class="navBtn" id="todayBtn">今天</button>
      <span id="dateLabel"></span>
      <span id="doneCount"></span>
    </div>
  </header>

  <div class="calWrap">
    <button class="navBtn" id="calToggle">打卡日历 ▾</button><span id="streak"></span>
    <div id="calendar" style="display:none"></div>
  </div>

  <div class="stage">
    <div id="bigSec"></div>
    <div id="bigWord">…</div>
    <div id="bigZh"></div>
    <div id="counter"></div>
    <div id="roundInfo" style="font-size:14px;color:#16a34a;margin-top:6px;min-height:18px;"></div>
    <div class="barWrap"><div id="bar"></div></div>
  </div>

  <div class="controls">
    <button class="ctlBtn" id="prevBtn">上一词</button>
    <button class="ctlBtn" id="playBtn">播放</button>
    <button class="ctlBtn" id="nextBtn">下一词</button>
    <button class="ctlBtn" id="againBtn">重读</button>
    <button class="ctlBtn" id="doneBtn">标记完成</button>
  </div>

  <div class="settings">
    <label>语速
      <select id="rateSel">
        <option value="0.6">很慢</option>
        <option value="0.85">慢（推荐）</option>
        <option value="1">正常</option>
      </select>
    </label>
    <label>跟读停顿
      <select id="pauseSel">
        <option value="1200">短</option>
        <option value="2500">中（推荐）</option>
        <option value="4000">长</option>
      </select>
    </label>
    <label><input type="checkbox" id="zhChk"> 读中文</label>
    <label><input type="checkbox" id="loopChk"> 循环播放</label>
    <label>英文声音 <select id="enVoice"><option value="">自动</option></select></label>
    <label>中文声音 <select id="zhVoice"><option value="">自动</option></select></label>
  </div>

  <div id="sections"></div>
  <div id="wordlist"></div>

  <div class="foot">
    播放顺序：英文常速 → 英文慢速 → 中文 → 跟读停顿。点任意单词可从它开始播。<br>
    快捷键：空格=播放/暂停，左右方向键=上一词/下一词。
  </div>

</div>
<script src="words1.js"></script>
<script src="words2.js"></script>
<script src="words3.js"></script>
<script src="words4.js"></script>
<script src="words5.js"></script>
<script src="phonics.js"></script>
<script src="app-classic.js"></script>
</body>
</html>
