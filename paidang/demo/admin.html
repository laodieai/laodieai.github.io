<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>后台管理</title><meta name="theme-color" content="#c62828">
<link rel="stylesheet" href="common.css">
<style>
.qd{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line)}
.qd .nm{font-weight:800;font-size:1.08rem}
.sw{position:relative;width:86px;height:44px;border-radius:22px;background:#cfd8dc;color:#fff;font-weight:800;font-size:.95rem;flex:none}
.sw.on{background:#757575}.sw:not(.on){background:var(--ok)}
.mk{background:#fff8e1;border:2px solid #ffcc80;border-radius:14px;padding:10px 12px;margin:10px 0}
.mk .two{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-top:6px}
.mk label{font-size:.9rem;color:var(--mut)}
.mk input{font-size:1.3rem;font-weight:800;padding:8px}
h3.c{color:var(--red);margin:18px 0 4px}
.f label{display:block;margin:10px 0 4px;font-weight:700}
.links .btn{display:block;text-align:center;text-decoration:none;margin:10px 0}
</style></head><body>
<div id="app"></div>
<script src="seed.js"></script><script src="qrcode.min.js"></script><script src="mock.js"></script><script src="common.js"></script>
<script>
let D = null, tab = localStorage.getItem('pd_atab') || 'today', filt = '';
requireLogin('老爹排档 · 后台', start);
async function start() {
  document.body.innerHTML = `<div class="topbar row"><b style="font-size:1.25rem" id="ttl">后台管理</b><a href="kitchen.html" style="margin-left:auto;font-weight:700">后厨/收银 →</a></div>
  <div class="tabs">${[['today', '今日时价/售罄'], ['dishes', '菜品'], ['cats', '分类'], ['settings', '店铺设置'], ['import', '批量导入'], ['qr', '桌卡二维码']].map(([k, v]) => `<button class="tab" data-t="${k}">${v}</button>`).join('')}</div>
  <div class="wrap" id="main" style="padding-bottom:60px"></div>`;
  $$('.tabs .tab').forEach(b => b.onclick = () => { tab = b.dataset.t; localStorage.setItem('pd_atab', tab); render(); });
  await reload();
}
async function reload() { D = await api('/api/admin/data'); $('#ttl').textContent = D.settings.storeName + ' · 后台'; render(); }
function render() {
  $$('.tabs .tab').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  const m = $('#main'); ({ today, dishes, cats, settings, import: imp, qr })[tab](m);
}
// ---- 今日时价/售罄
function today(m) {
  const mk = D.dishes.filter(d => d.is_market_price);
  m.innerHTML = `<h3 class="c">今日时价（每天更新）</h3><p class="mut" style="margin:0">填今日单价和加工费，顾客页显示「¥XX/斤（今日价）」。清空＝显示「时价，以称重为准」。</p>
  ${mk.map(d => `<div class="mk" data-id="${esc(d.id)}"><div class="row"><span class="nm" style="font-weight:800;font-size:1.1rem">${esc(d.name)}</span><span class="mut">(${esc(d.unit)})</span>
   <button class="sw ${d.sold_out ? 'on' : ''}" data-so style="margin-left:auto">${d.sold_out ? '已售罄' : '有货'}</button></div>
   <div class="two"><div><label>今日单价 元/${esc(d.unit)}</label><input data-f="today_price_per_jin" type="number" inputmode="decimal" value="${d.today_price_per_jin ?? ''}" placeholder="未设"></div>
   <div><label>加工费 元</label><input data-f="process_fee" type="number" inputmode="decimal" value="${d.process_fee ?? ''}" placeholder="无"></div><button class="btn sm" data-save>保存</button></div></div>`).join('')}
  <h3 class="c">售罄开关</h3><input id="flt" placeholder="搜菜名…" value="${esc(filt)}">
  <div id="sol">${soldList()}</div>`;
  $('#flt').oninput = e => { filt = e.target.value.trim(); $('#sol').innerHTML = soldList(); };
  m.onclick = async e => {
    const b = e.target.closest('button'); if (!b) return; const id = b.closest('[data-id]').dataset.id; const d = D.dishes.find(x => x.id === id);
    try {
      if (b.hasAttribute('data-so')) { const j = await api(`/api/admin/dish/${encodeURIComponent(id)}/quick`, { body: { sold_out: !d.sold_out } }); Object.assign(d, j.dish);
        $$(`[data-id="${CSS.escape(id)}"] [data-so]`).forEach(x => { x.classList.toggle('on', d.sold_out); x.textContent = d.sold_out ? '已售罄' : '有货'; }); toast(d.name + (d.sold_out ? ' 已设售罄' : ' 恢复有货')); }
      if (b.hasAttribute('data-save')) { const box = b.closest('.mk'); const body = {}; $$('[data-f]', box).forEach(i => body[i.dataset.f] = i.value);
        const j = await api(`/api/admin/dish/${encodeURIComponent(id)}/quick`, { body }); Object.assign(d, j.dish); toast('已保存：' + d.name); }
    } catch (err) { toast(err.message); }
  };
}
function soldList() {
  return D.dishes.filter(d => !d.is_market_price && (!filt || d.name.includes(filt) || d.category.includes(filt))).map(d =>
    `<div class="qd" data-id="${esc(d.id)}"><div class="grow"><div class="nm">${esc(d.name)}</div><div class="mut" style="font-size:.85rem">${esc(d.category)} · ¥${d.price}/${esc(d.unit)}</div></div><button class="sw ${d.sold_out ? 'on' : ''}" data-so>${d.sold_out ? '已售罄' : '有货'}</button></div>`).join('');
}
// ---- 菜品
function dishes(m) {
  m.innerHTML = `<button class="btn" style="width:100%;margin-top:12px" id="add">＋ 新增菜品</button>
  ${D.categories.map(c => `<h3 class="c">${esc(c)}</h3>${D.dishes.filter(d => d.category === c).map(d => `<div class="qd" data-id="${esc(d.id)}"><div class="grow"><div class="nm">${esc(d.name)}${d.is_signature ? '<span class="badge b-sig">招牌</span>' : ''}${spicy(d.spicy)}${d.sold_out ? '<span class="badge b-out">售罄</span>' : ''}</div>
    <div class="mut" style="font-size:.85rem">${d.is_market_price ? '时价' + (d.today_price_per_jin != null ? ' 今日¥' + d.today_price_per_jin : '') : '¥' + d.price}/${esc(d.unit)}${d.available_after ? ' · ' + esc(d.available_after) + '后供应' : ''}</div></div>
    <button class="btn gray sm" data-ed>改</button><button class="btn line sm" data-del>删</button></div>`).join('') || '<p class="mut">（空）</p>'}`).join('')}`;
  $('#add').onclick = () => edit(null);
  m.onclick = async e => { const b = e.target.closest('button'); if (!b || b.id === 'add') return; const id = b.closest('[data-id]').dataset.id; const d = D.dishes.find(x => x.id === id);
    if (b.hasAttribute('data-ed')) edit(d);
    if (b.hasAttribute('data-del') && confirm(`删除「${d.name}」？`)) { await api(`/api/admin/dish/${encodeURIComponent(id)}`, { method: 'DELETE' }); toast('已删除'); reload(); } };
}
function edit(d) {
  d = d || { category: D.categories[0], unit: '份', spicy: 0 };
  const m = sheet(`<h2>${d.id ? '修改菜品' : '新增菜品'}</h2><div class="f">
   <label>分类</label><select id="cat">${D.categories.map(c => `<option ${c === d.category ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
   <label>菜名</label><input id="name" value="${esc(d.name || '')}">
   <label><input type="checkbox" id="mk" style="width:auto" ${d.is_market_price ? 'checked' : ''}> 时价菜（称重/当天定价）</label>
   <div class="row"><div class="grow"><label>价格（元）</label><input id="price" type="number" inputmode="decimal" value="${d.price ?? ''}"></div><div class="grow"><label>单位</label><input id="unit" value="${esc(d.unit || '份')}" placeholder="份/串/斤/瓶"></div></div>
   <label><input type="checkbox" id="sig" style="width:auto" ${d.is_signature ? 'checked' : ''}> 招牌菜</label>
   <label>辣度</label><select id="sp">${['不辣', '微辣🌶', '辣🌶🌶'].map((x, i) => `<option value="${i}" ${+d.spicy === i ? 'selected' : ''}>${x}</option>`).join('')}</select>
   <label>介绍</label><textarea id="desc" rows="2">${esc(d.desc || '')}</textarea>
   <label>价格备注（内部）</label><input id="pn" value="${esc(d.price_note || '')}">
   <label>几点后才供应（如 21:30，留空＝全天）</label><input id="aa" value="${esc(d.available_after || '')}" placeholder="21:30"></div>
   <div class="row" style="margin-top:14px"><button class="btn gray grow" id="c">取消</button><button class="btn grow" id="s">保存</button></div>`);
  $('#c', m).onclick = m.close;
  $('#s', m).onclick = async () => {
    const body = { origId: d.id, id: d.id, category: $('#cat', m).value, name: $('#name', m).value.trim(), is_market_price: $('#mk', m).checked, price: $('#mk', m).checked ? null : $('#price', m).value,
      unit: $('#unit', m).value, is_signature: $('#sig', m).checked, spicy: +$('#sp', m).value, desc: $('#desc', m).value, price_note: $('#pn', m).value, available_after: $('#aa', m).value.trim(),
      today_price_per_jin: d.today_price_per_jin, process_fee: d.process_fee };
    if (!body.is_market_price && body.price === '') return toast('请填价格，或勾选时价');
    try { await api('/api/admin/dish', { body }); m.close(); toast('已保存'); reload(); } catch (e) { toast(e.message); }
  };
}
// ---- 分类
function cats(m) {
  m.innerHTML = `<div class="row" style="margin-top:12px"><input id="nc" placeholder="新分类名"><button class="btn" id="add" style="flex:none">添加</button></div>
  ${D.categories.map(c => `<div class="qd" data-c="${esc(c)}"><span class="grow nm">${esc(c)} <small class="mut">(${D.dishes.filter(d => d.category === c).length}道)</small></span>
   <button class="btn gray sm" data-a="up">↑</button><button class="btn gray sm" data-a="down">↓</button><button class="btn gray sm" data-a="rename">改名</button><button class="btn line sm" data-a="delete">删</button></div>`).join('')}`;
  m.onclick = async e => { const b = e.target.closest('button'); if (!b) return;
    try {
      if (b.id === 'add') { await api('/api/admin/category', { body: { action: 'add', name: $('#nc').value } }); return reload(); }
      const c = b.closest('[data-c]').dataset.c, a = b.dataset.a;
      if (a === 'up' || a === 'down') await api('/api/admin/category', { body: { action: 'move', name: c, dir: a === 'up' ? -1 : 1 } });
      if (a === 'rename') { const n = prompt('新名称', c); if (!n) return; await api('/api/admin/category', { body: { action: 'rename', name: c, newName: n } }); }
      if (a === 'delete') { if (!confirm('删除分类「' + c + '」？')) return; await api('/api/admin/category', { body: { action: 'delete', name: c } }); }
      reload();
    } catch (err) { toast(err.message, 2500); } };
}
// ---- 设置
function settings(m) {
  const s = D.settings;
  m.innerHTML = `<div class="card f"><label>店名</label><input id="sn" value="${esc(s.storeName)}">
   <label>桌数（自动编号 1~N）</label><input id="tc" type="number" inputmode="numeric" value="${s.tableCount}">
   <label>自定义桌号（可选，逗号分开，如 A01,A02,包厢1；填了就不用上面的桌数）</label><input id="tl" value="${esc(s.tableList || '')}" placeholder="留空＝用桌数">
   <label>对外网址（二维码用；留空＝自动用当前隧道网址）</label><input id="bu" value="${esc(s.baseUrl || '')}" placeholder="${esc(D.effectiveBaseUrl)}">
   <p class="mut" style="font-size:.9rem;margin:4px 0">现在二维码用的网址：<b>${esc(D.effectiveBaseUrl)}</b></p>
   <label>修改PIN（4-8位数字，留空不改）</label><input id="np" type="password" inputmode="numeric" maxlength="8">
   <button class="btn" style="width:100%;margin-top:14px" id="sv">保存设置</button></div>
   <label>包厢（桌号里哪些是包厢，逗号分开）</label><input id="rl" value="${esc(s.roomList || '')}" placeholder="如 666,888">
   <div class="card">现在桌号：${D.tables.map(t => (D.rooms || []).includes(t) ? '包厢' + esc(t) : esc(t)).join('、')}</div>
   <button class="btn gray" style="width:100%" id="lo">退出登录</button>`;
  $('#sv').onclick = async () => { try { await api('/api/admin/settings', { body: { storeName: $('#sn').value, tableCount: $('#tc').value, tableList: $('#tl').value, roomList: $('#rl').value, baseUrl: $('#bu').value, newPin: $('#np').value } }); toast('已保存'); reload(); } catch (e) { toast(e.message); } };
  $('#lo').onclick = () => { localStorage.removeItem(TK); location.reload(); };
}
// ---- 导入
function imp(m) {
  m.innerHTML = `<div class="card f"><label>格式</label><select id="fm"><option value="csv">CSV（分类,菜名,价格,单位,是否时价,是否招牌）</option><option value="json">JSON（与 menu.json 相同格式）</option></select>
   <label>选择文件（或直接粘贴到下面）</label><input type="file" id="fl" accept=".csv,.json,.txt">
   <textarea id="tx" rows="8" placeholder="分类,菜名,价格,单位,是否时价,是否招牌&#10;烧烤,烤生蚝,8,个,否,是&#10;海鲜现炒,酒焖蝤蠓,,斤,是,是"></textarea>
   <label>方式</label><select id="md"><option value="merge">追加/按菜名更新（保留现有）</option><option value="replace">全部替换（清空旧菜单）</option></select>
   <button class="btn" style="width:100%;margin-top:14px" id="go">开始导入</button></div>
   <p class="mut">CSV 用 Excel 另存为「CSV UTF-8」。是否时价/是否招牌 填 是/否。</p>`;
  $('#fl').onchange = async e => { const f = e.target.files[0]; if (!f) return; $('#tx').value = await f.text(); if (/\.json$/i.test(f.name)) $('#fm').value = 'json'; };
  $('#go').onclick = async () => { if ($('#md').value === 'replace' && !confirm('确定清空旧菜单，全部替换？')) return;
    try { const j = await api('/api/admin/import', { body: { format: $('#fm').value, text: $('#tx').value, mode: $('#md').value } }); toast(`导入完成：新增${j.added}，更新${j.updated}，共${j.total}道`, 3000); reload(); } catch (e) { toast(e.message, 3000); } };
}
// ---- 二维码
function qr(m) {
  m.innerHTML = `<div class="card"><p>为每张桌生成A6桌卡（店名、桌号、「扫码点菜」），可直接打印。</p><p class="mut">二维码网址：<b>${esc(D.effectiveBaseUrl)}</b>/?t=桌号<br>隧道网址变了以后，回来重新打印即可（或在「店铺设置」填固定网址）。</p>
   <div class="links"><a class="btn" href="qr.html" >打开桌卡打印页</a><a class="btn ora" href="order.html?t=${encodeURIComponent(D.tables[0] || '1')}" >预览顾客点菜页</a><a class="btn gray" href="kitchen.html">代客下单（去后厨页）</a></div></div>`;
}
</script></body></html>
